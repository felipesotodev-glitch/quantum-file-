name: Deploy to OpenShift

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  OPENSHIFT_SERVER: https://api.rm1.0a51.p1.openshiftapps.com:6443
  OPENSHIFT_PROJECT: felipesoto-dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: mvn clean package -DskipTests
    
    - name: Install OpenShift CLI
      uses: redhat-actions/openshift-tools-installer@v1
      with:
        oc: latest
    
    - name: Login to OpenShift
      run: |
        oc login --token=${{ secrets.OPENSHIFT_TOKEN }} --server=${{ env.OPENSHIFT_SERVER }}
        oc project ${{ env.OPENSHIFT_PROJECT }}
    
    - name: Build and Deploy File Ingester
      run: |
        cd file-ingester
        if oc get bc/file-ingester &>/dev/null; then
          oc start-build file-ingester --from-dir=. --follow --wait
        else
          echo "BuildConfig file-ingester not found, creating new-app..."
          oc new-build --name=file-ingester --binary --strategy=docker
          oc start-build file-ingester --from-dir=. --follow --wait
          oc new-app file-ingester
          oc set env deployment/file-ingester \
            AMQ_HOST=amq-core \
            AMQ_PORT=61616 \
            AMQ_USER=${{ secrets.AMQ_USER || 'admin' }} \
            AMQ_PASSWORD=${{ secrets.AMQ_PASSWORD || 'admin' }} \
            REDIS_HOST=redis \
            REDIS_PORT=6379
          oc set resources deployment/file-ingester \
            --requests=cpu=100m,memory=512Mi \
            --limits=cpu=500m,memory=1Gi
        fi
        cd ..
    
    - name: Build and Deploy Chunk Processor
      run: |
        cd chunk-processor
        if oc get bc/chunk-processor &>/dev/null; then
          oc start-build chunk-processor --from-dir=. --follow --wait
        else
          echo "BuildConfig chunk-processor not found, creating new-app..."
          oc new-build --name=chunk-processor --binary --strategy=docker
          oc start-build chunk-processor --from-dir=. --follow --wait
          oc new-app chunk-processor
          oc set env deployment/chunk-processor \
            AMQ_HOST=amq-core \
            AMQ_PORT=61616 \
            AMQ_USER=${{ secrets.AMQ_USER || 'admin' }} \
            AMQ_PASSWORD=${{ secrets.AMQ_PASSWORD || 'admin' }} \
            REDIS_HOST=redis \
            REDIS_PORT=6379 \
            CONSUMER_CONCURRENCY=1-3
          oc set resources deployment/chunk-processor \
            --requests=cpu=100m,memory=512Mi \
            --limits=cpu=500m,memory=1Gi
          oc scale deployment/chunk-processor --replicas=2
        fi
        cd ..
    
    - name: Wait for deployments
      run: |
        oc rollout status deployment/file-ingester --timeout=5m
        oc rollout status deployment/chunk-processor --timeout=5m
    
    - name: Verify Deployment
      run: |
        echo "=== Pods Status ==="
        oc get pods -l app=file-ingester
        oc get pods -l app=chunk-processor
        echo ""
        echo "=== Services ==="
        oc get svc file-ingester chunk-processor
        echo ""
        echo "=== Routes ==="
        oc get routes
